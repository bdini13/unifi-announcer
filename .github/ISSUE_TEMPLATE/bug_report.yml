name: Bug report
description: Report a reproducible UniFi Announcer problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not post secrets, console addresses, device IDs, certificate details, screenshots containing revealed credentials, raw support logs, or private audio. Report security issues through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: UniFi Announcer version
      placeholder: v2.1.8
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Docker/Compose, Protect version, Smart Chime model and firmware; redact private details.
    validations:
      required: true
  - type: dropdown
    id: tts_mode
    attributes:
      label: TTS mode
      options:
        - TTS_ENGINE=none (preset/default/buzzer only)
        - Piper arbitrary TTS
        - Edge arbitrary TTS
        - Other / unsure
    validations:
      required: true
  - type: dropdown
    id: credential_check
    attributes:
      label: Smart Chime credential verification
      description: On validated Protect 7.2.105, use Devices → Smart WiFi Chime → Settings → Manage → Manual Recovery → Reveal, then optionally run the read-only /api/info check in CREDENTIALS.md. Use Reveal, not Edit. Never paste the revealed credential.
      options:
        - Not applicable (TTS_ENGINE=none)
        - Reveal available; /api/info returned HTTP 200
        - Reveal available; /api/info returned HTTP 401
        - Reveal available; verification not tested
        - Reveal control unavailable / different UI
        - Timeout / connection failure
    validations:
      required: true
  - type: dropdown
    id: physical_devices
    attributes:
      label: Physical Smart Chimes involved
      options:
        - One
        - Two or more
        - None / automated test only
    validations:
      required: true
  - type: dropdown
    id: lifecycle_context
    attributes:
      label: Smart Chime lifecycle context
      description: v2.1.8 invalidates resident TTS content after reboot/reconnect. Select the closest state before the problem occurred.
      options:
        - No known reboot/reconnect; same Chime boot
        - Smart Chime rebooted or lost power
        - Protect reported a Chime disconnect/reconnect
        - UniFi Announcer container restarted only
        - Protect/console restarted
        - Unknown / unsure
    validations:
      required: true
  - type: textarea
    id: slot_status
    attributes:
      label: Sanitized TTS slot status / metrics
      description: If relevant, summarize /tts/slots/status or /metrics/json without private IDs, addresses, credentials, or raw support logs. Include whether the request was a content hit/miss and whether an overwrite occurred.
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, private network details, device IDs, certificate data, screenshots containing revealed secrets, support logs, and private audio.
          required: true
        - label: This is not a security vulnerability.
          required: true
