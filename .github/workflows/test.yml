name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -W error -m pytest -q tests
        env:
          EVENTS_ENABLED: "false"
          TTS_ENGINE: "none"
          UNIFI_HOST: "https://unifi.invalid"
          CHIME_DIRECT_IP: "192.0.2.10"
      - run: ruff check .
      - run: python -m compileall -q app custom_components
      - run: python -m json.tool custom_components/unifi_announcer/manifest.json >/dev/null
      - run: python -m json.tool custom_components/unifi_announcer/strings.json >/dev/null
      - run: python -m json.tool custom_components/unifi_announcer/translations/en.json >/dev/null
      - run: python -m json.tool hacs.json >/dev/null
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null
      - run: docker build --build-arg GIT_SHA=${{ github.sha }} .

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ha-test.txt
      - run: pip install -r requirements-ha-test.txt
      - name: Run Home Assistant tests
        # Do not set interpreter-level -W error here: the official HA custom-
        # component pytest plugin and HA itself emit upstream deprecations while
        # pytest plugins are importing, before pytest.ini can load. Once pytest
        # starts, pytest.ini still applies filterwarnings=error to collected tests.
        run: python -m pytest -q tests_ha
