name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new commit supersedes older CI for the same PR/ref. Preserve required job names.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            requirements-dev.txt
      - run: uv pip install --system -r requirements-dev.txt
      - run: python -W error -m pytest -q tests --durations=10
        env:
          EVENTS_ENABLED: "false"
          TTS_ENGINE: "none"
          UNIFI_HOST: "https://unifi.invalid"
          CHIME_DIRECT_IP: "192.0.2.10"
      - run: ruff check .
      - run: python -m compileall -q app custom_components
      - run: python -m json.tool custom_components/unifi_announcer/manifest.json >/dev/null
      - run: python -m json.tool custom_components/unifi_announcer/strings.json >/dev/null
      - run: python -m json.tool custom_components/unifi_announcer/translations/en.json >/dev/null
      - run: python -m json.tool hacs.json >/dev/null
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build container (cached, no publication)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=announcer-ci
          cache-to: type=gha,scope=announcer-ci,mode=max

  home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: |
            requirements-ha-test.txt
      - run: uv pip install --system -r requirements-ha-test.txt
      - name: Run Home Assistant tests
        # Do not set interpreter-level -W error here: the official HA custom-
        # component pytest plugin and HA itself emit upstream deprecations while
        # pytest plugins are importing, before pytest.ini can load. Once pytest
        # starts, pytest.ini still applies filterwarnings=error to collected tests.
        run: python -m pytest -q tests_ha --durations=10

  home-assistant-current:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: |
            requirements-ha-current-test.txt
      - run: uv pip install --system -r requirements-ha-current-test.txt
      - name: Run Home Assistant tests
        # Do not set interpreter-level -W error here: the official HA custom-
        # component pytest plugin and HA itself emit upstream deprecations while
        # pytest plugins are importing, before pytest.ini can load. Once pytest
        # starts, pytest.ini still applies filterwarnings=error to collected tests.
        run: python -m pytest -q tests_ha --durations=10
