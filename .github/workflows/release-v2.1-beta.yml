name: release-v2.1

on:
  workflow_run:
    workflows: ["test"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Repeat the HA packaging gates against the exact commit being tagged so
      # release creation cannot race the separate validation workflow.
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

      - name: Publish v2.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v2.1.0
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to publish."
            exit 0
          fi

          gh release create "$TAG" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "v2.1.0 — Home Assistant, MCP, and fixed-slot TTS" \
            --notes-file docs/RELEASE_NOTES_v2.1.0.md
