name: release-v2.1

on:
  workflow_run:
    workflows: ["test"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Repeat the HA packaging gates against the exact commit being tagged so
      # release creation cannot race the separate validation workflow.
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, pinned 2026-08-29
        with:
          category: integration

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master, pinned 2026-08-29

      - name: Publish v2.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: 2.1.0
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(python -c 'from app.version import APP_VERSION; print(APP_VERSION)')" = "$EXPECTED_VERSION"
          test "$(python -c 'import json; print(json.load(open("custom_components/unifi_announcer/manifest.json"))["version"])')" = "$EXPECTED_VERSION"
          test "$(python -c 'import ast; tree=ast.parse(open("custom_components/unifi_announcer/const.py").read()); print(next(node.value.value for node in tree.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == "INTEGRATION_VERSION" for target in node.targets)))')" = "$EXPECTED_VERSION"

          VALIDATED_SHA="${{ github.event.workflow_run.head_sha }}" python scripts/release_v2_1.py
