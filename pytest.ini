[pytest]
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error
    ignore:Please use `import python_multipart` instead\.:PendingDeprecationWarning:starlette\.formparsers
    ignore:It is recommended to use web\.AppKey instances for keys\.:aiohttp.web_exceptions.NotAppKeyWarning:homeassistant\.components\.http
